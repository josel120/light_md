# Builds light_md on Windows, macOS and Linux for every push and pull request.
# When a version tag (v*) is pushed, the Windows and macOS packages are attached
# to the GitHub release of that tag (a draft release is created if none exists).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: '6.9.3'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Package name
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Install Qt (Windows, MinGW)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_mingw
          tools: tools_mingw1310
          cache: true

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DLIGHT_MD_TESTS=ON
          cmake --build build --parallel
          cmake --install build --prefix "$(pwd -W)/dist"
          cd dist && 7z a "../light_md-${VERSION}-windows-x64.zip" .

      # The Windows installer (packaging/windows/light_md.iss), from the same dist folder as the
      # zip: Start menu entry, uninstaller, and light_md registered for .md files.
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then choco install innosetup --no-progress -y; fi
          NUMERIC=$(sed -n 's/^project(light_md VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          # "-D", not "/D": Git Bash would turn "/D..." into a path.
          "$ISCC" -Q "-DAppVersion=${VERSION}" "-DNumericVersion=${NUMERIC}" packaging/windows/light_md.iss
          ls -l light_md-*-setup.exe

      # Universal app (Apple Silicon and Intel). The ad-hoc signature is needed because
      # macdeployqt changes the binaries; without it Apple Silicon Macs refuse to start the app.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DLIGHT_MD_TESTS=ON
          cmake --build build --parallel
          cmake --install build --prefix "$PWD/dist"
          codesign --force --deep --sign - dist/light_md.app
          codesign --verify --deep --strict dist/light_md.app
          lipo -info dist/light_md.app/Contents/MacOS/light_md
          ditto -c -k --keepParent dist/light_md.app "light_md-${VERSION}-macos.zip"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLIGHT_MD_TESTS=ON
          cmake --build build --parallel

      # Unit tests (tests/), without a screen: they set QT_QPA_PLATFORM=offscreen.
      # -V prints each test function as it runs, so a stuck one shows in the log; Qt stops a
      # single test function after 2 minutes, before ctest's 5-minute limit for the whole file.
      - name: Test
        shell: bash
        env:
          QTEST_FUNCTION_TIMEOUT: '120000'
        run: |
          # On Windows the tests need the C++ runtime of the MinGW that built them, not an older
          # libstdc++ that Git Bash or other tools put first on the PATH.
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="$IQTA_TOOLS/mingw1310_64/bin:$QT_ROOT_DIR/bin:$PATH"
          fi
          ctest --test-dir build --output-on-failure -V

      # The tests' own logs: they show the last test function that ran, even if ctest had to
      # stop the program.
      - name: Test logs
        if: failure()
        shell: bash
        run: |
          for log in build/tests/*.log; do echo "===== $log"; cat "$log"; done

      - name: Upload package
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: light_md-${{ env.VERSION }}-${{ matrix.name }}
          path: |
            light_md-*.zip
            light_md-*-setup.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Windows and macOS jobs run at the same time: if both try to create the
          # release, the second create fails harmlessly and the upload still works.
          gh release view "$VERSION" > /dev/null 2>&1 || \
            gh release create "$VERSION" --draft --title "light_md $VERSION" --notes "Release notes to be written." || true
          sleep 5
          # The installer exists only on Windows.
          gh release upload "$VERSION" light_md-*.zip $(ls light_md-*-setup.exe 2>/dev/null) --clobber
